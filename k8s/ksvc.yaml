apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: poc-cesg-poi-search
  namespace: knative-pool
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/target: "5"
        autoscaling.knative.dev/scale-down-delay: "300s"
    spec:
      containerConcurrency: 5
      timeoutSeconds: 300
      nodeSelector:
        yuiseki.net/compute: "true"
      containers:
        - image: 192.168.0.90:5000/poc-cesg-poi-search:0.1.2
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: HOME
              value: /tmp
            - name: POI_SEARCH_ASSET_URL
              value: "http://cng-storage-http.cng-storage.svc.cluster.local/cesg-poi-search/tokyo/poi-search.duckdb"
            - name: POI_SEARCH_MANIFEST_URL
              value: "http://cng-storage-http.cng-storage.svc.cluster.local/cesg-poi-search/tokyo/poi-search-manifest.json"
            - name: POI_SEARCH_LOCAL_CACHE
              value: "/tmp/poi-search.duckdb"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
              ephemeral-storage: "2Gi"
